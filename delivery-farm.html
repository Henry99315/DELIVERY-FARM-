<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Delivery Farm</title>
<style>
  :root{--green:#1f6f43;--green-d:#165233;--green-l:#e8f3ec;--red:#c0392b;--red-l:#fbeaea;--amber:#9a6700;--amber-l:#fff4d6;--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e3e1da}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{width:100%;max-width:420px}
  .brand{text-align:center;margin-bottom:24px}
  .brand .logo{font-size:44px}
  .brand h1{margin:6px 0 2px;font-size:26px;color:var(--green)}
  .brand p{margin:0;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:transparent}
  .phone{display:flex;gap:8px}
  .phone select{width:110px;flex:none}
  .two{display:flex;gap:8px}
  .two>div{flex:1;min-width:0}
  button{font:inherit;cursor:pointer;color:inherit}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:700;margin-top:20px;text-align:center;text-decoration:none}
  .btn:active{background:var(--green-d)}
  .btn:disabled{opacity:.6}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);margin-top:10px}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);margin-top:10px}
  .link{background:none;border:0;color:var(--green);font-weight:600;padding:12px 0;width:100%;text-align:center}
  .msg{padding:12px;border-radius:10px;margin-bottom:12px;font-size:15px}
  .msg.err{background:var(--red-l);color:var(--red)}
  .msg.ok{background:var(--green-l);color:var(--green-d)}
  .note{color:var(--muted);font-size:14px;margin:10px 0 0}
  header.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
  header.top .who b{display:block;font-size:17px}
  header.top .who span{font-size:13px;opacity:.85}
  header.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
  main{padding:16px;padding-bottom:110px;max-width:720px;margin:0 auto}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:12px;font-weight:600}
  nav.tabs button .i{display:block;font-size:22px;margin-bottom:2px}
  nav.tabs button.on{color:var(--green)}
  h2{font-size:21px;margin:4px 0 14px}
  h4{margin:22px 0 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .soon{text-align:center;padding:36px 18px}
  .soon .i{font-size:46px}
  .soon p{color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
  .thumb{width:52px;height:52px;border-radius:10px;background:var(--green-l);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:24px}
  .item .info{flex:1;min-width:0}
  .item .info b{display:block}
  .item .info small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .right{text-align:right;flex:none}
  .item .right b{display:block}
  .badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:20px;background:var(--green-l);color:var(--green-d);white-space:nowrap;display:inline-block}
  .badge.off,.badge.red{background:var(--red-l);color:var(--red)}
  .badge.amber{background:var(--amber-l);color:var(--amber)}
  .badge.gray{background:#eee;color:#666}
  .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .row h2{margin:0}
  .small-btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;white-space:nowrap}
  .small-btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .summary{display:flex;gap:10px;margin-bottom:12px}
  .summary div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .summary small{display:block;color:var(--muted);font-size:12px}
  .summary b{font-size:18px}
  .search{margin-bottom:12px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 4px;font-size:20px}
  .switch{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-weight:600}
  .switch input{width:24px;height:24px}
  .photo-pick{display:flex;align-items:center;gap:12px}
  .photo-pick img{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--green-l)}
  .photo-pick .ph{width:96px;height:96px;border-radius:12px;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
  .photo-btn{display:inline-block;margin:0;background:#fff;color:var(--green);border:1px solid var(--green);border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
  .big-photo{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:10px}
  .prod{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .prod:last-child{border-bottom:0}
  .prod .info{flex:1;min-width:0}
  .prod .info small{color:var(--muted);display:block}
  .stepper{display:flex;align-items:center;gap:6px;flex:none}
  .stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--green)}
  .stepper input{width:52px;text-align:center;padding:8px 4px}
  .stepper.has input{border-color:var(--green);font-weight:700}
  .picked{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-l);border-radius:12px;padding:12px}
  .picked small{display:block;color:var(--muted)}
  .results{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
  .results button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px}
  .results button:last-child{border-bottom:0}
  .results small{color:var(--muted);display:block}
  .totalbar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;margin:16px -16px calc(-18px - env(safe-area-inset-bottom));padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .totalbar .row{margin:0}
  .totalbar .btn{margin-top:10px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:13px;color:var(--muted);background:#faf9f6}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .kv span{color:var(--muted)}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions a,.actions button{flex:1}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{margin:0;position:relative}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:15px}
  .opt input:checked + span{border-color:var(--green);background:var(--green-l);color:var(--green-d);box-shadow:0 0 0 1px var(--green)}
  .stop .num{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .stop-name{background:none;border:0;padding:0;font-weight:700;font-size:17px;text-align:left}
  .stop .actions .small-btn{flex:1;padding:12px 6px}
  .summary .due b{color:var(--red)}
  .summary .ok b{color:var(--green)}
  nav.tabs button .i{position:relative}
  .tabdot{display:none;position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:24px;z-index:30;font-size:15px;max-width:90vw;text-align:center}
  .spinner{width:36px;height:36px;border:4px solid var(--green-l);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot, writeBatch, runTransaction, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

/* ===== Configuração do Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBlqTko7E_bnGh7Yn3wuKPUWLIncwf0DhE",
  authDomain: "delivery-farm-bff08.firebaseapp.com",
  projectId: "delivery-farm-bff08",
  storageBucket: "delivery-farm-bff08.firebasestorage.app",
  messagingSenderId: "477347473207",
  appId: "1:477347473207:web:d0ab54f90582b4f6271cb2",
  measurementId: "G-WZ79T7W7MD"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// Segunda instância: permite o administrador criar usuários sem sair da própria conta
const secAuth = getAuth(initializeApp(firebaseConfig, "secondary"));

/* ===== Perfis e abas ===== */
const ROLES = { admin: "Administrador", vendedor: "Vendedor", entregador: "Entregador", contador: "Contador" };
const TABS = {
  vendas:   { label: "Vendas",   icon: "🛒" },
  entregas: { label: "Entregas", icon: "🚚", desc: "Rota do dia pela localização do celular, baixa da entrega com foto e mensagens pelo WhatsApp." },
  contas:   { label: "Contas",   icon: "💵", desc: "Ordens em verde (pagas) e vermelho (pendentes), e confirmação de pagamentos em cash, Zelle e Venmo." },
  equipe:   { label: "Equipe",   icon: "👥" }
};
const ACCESS = {
  admin: ["vendas", "entregas", "contas", "equipe"],
  vendedor: ["vendas", "contas"],
  entregador: ["entregas"],
  contador: ["contas"]
};
const DAYS = { sab: { label: "Sábado", idx: 6 }, dom: { label: "Domingo", idx: 0 } };
const STATUS = { aberta: ["Aberta", "amber"], entregue: ["Entregue", ""], cancelada: ["Cancelada", "gray"] };

/* ===== Utilidades ===== */
const $app = document.getElementById("app");
let me = null, tab = null, settingUp = false, unsubUsers = null, users = [];
let data = { products: [], clients: [], regions: [], orders: [], settings: {}, loaded: {} };
let dataUnsubs = [];
let vsub = "ordens", clientSearch = "", orderDate = null, sepDate = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const val = id => $(id).value.trim();
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const byName = (a, b) => (a.name || "").localeCompare(b.name || "");
const money = n => "$" + (Number(n) || 0).toFixed(2);
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const fmtDate = s => { if (!s) return ""; const d = parseISO(s); return `${DOW[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const today = () => isoDate(new Date());
function nextDateFor(day) {
  const idx = DAYS[day]?.idx ?? 6;
  const d = new Date();
  while (d.getDay() !== idx) d.setDate(d.getDate() + 1);
  return isoDate(d);
}
const addressLine = c => [c.street + (c.apt ? `, ${c.apt}` : ""), c.city, `${c.state || ""} ${c.zip || ""}`.trim()].filter(Boolean).join(", ");
const mapLink = c => "https://maps.apple.com/?q=" + encodeURIComponent(addressLine(c));
const can = (...roles) => roles.includes(me?.role);

const ERR = {
  "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/wrong-password": "E-mail ou senha incorretos.",
  "auth/user-not-found": "E-mail ou senha incorretos.",
  "auth/invalid-email": "E-mail inválido.",
  "auth/missing-password": "Digite a senha.",
  "auth/email-already-in-use": "Esse e-mail já está cadastrado.",
  "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
  "auth/too-many-requests": "Muitas tentativas. Espere um pouco e tente de novo.",
  "auth/network-request-failed": "Sem conexão com a internet.",
  "auth/operation-not-allowed": "Ative o login por e-mail e senha no Firebase (Authentication).",
  "permission-denied": "Sem permissão. Confira se as regras novas do Firestore foram publicadas.",
  "unavailable": "Sem conexão com o banco de dados. Verifique a internet."
};
const errMsg = e => ERR[e?.code] || e?.message || "Erro inesperado.";

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function phoneFields(id, value = "") {
  const cc = value.startsWith("+55") ? "+55" : "+1";
  const num = value ? value.slice(cc.length) : "";
  return `<div class="phone">
    <select id="${id}-cc">
      <option value="+1" ${cc === "+1" ? "selected" : ""}>🇺🇸 +1</option>
      <option value="+55" ${cc === "+55" ? "selected" : ""}>🇧🇷 +55</option>
    </select>
    <input id="${id}-num" type="tel" inputmode="tel" placeholder="Número com DDD / area code" value="${esc(num)}">
  </div>`;
}
function readPhone(id) {
  const n = $(id + "-num").value.replace(/\D/g, "");
  return n ? $(id + "-cc").value + n : "";
}
function prettyPhone(p = "") {
  const m1 = p.match(/^\+1(\d{3})(\d{3})(\d{4})$/);
  if (m1) return `+1 (${m1[1]}) ${m1[2]}-${m1[3]}`;
  const m55 = p.match(/^\+55(\d{2})(\d{4,5})(\d{4})$/);
  if (m55) return `+55 (${m55[1]}) ${m55[2]}-${m55[3]}`;
  return p;
}
function setBusy(btn, busy, text) {
  btn.disabled = busy;
  if (busy) { btn.dataset.t = btn.textContent; btn.textContent = text || "Aguarde..."; }
  else if (btn.dataset.t) btn.textContent = btn.dataset.t;
}

// Reduz a foto antes de salvar (fica leve e cabe no banco de dados)
function compressImage(file, max = 800, q = 0.65) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Não consegui abrir essa foto.")); };
    img.src = url;
  });
}
function photoPicker(id, current, icon) {
  return `<div class="photo-pick">
    ${current ? `<img id="${id}-img" src="${current}" alt="">` : `<div class="ph" id="${id}-img">${icon}</div>`}
    <div><label class="photo-btn" for="${id}-file">📷 Tirar ou escolher foto</label>
    <input id="${id}-file" type="file" accept="image/*" hidden></div>
  </div>`;
}
function wirePhoto(id, max, q, onPhoto) {
  $(id + "-file").onchange = async ev => {
    const f = ev.target.files[0];
    if (!f) return;
    try {
      const dataUrl = await compressImage(f, max, q);
      onPhoto(dataUrl);
      const old = $(id + "-img");
      const img = document.createElement("img");
      img.id = id + "-img"; img.src = dataUrl; img.alt = "";
      old.replaceWith(img);
    } catch (e) { toast(errMsg(e)); }
  };
}

/* ===== Folhas (janelas que sobem de baixo) ===== */
function closeSheet() { document.querySelector(".overlay")?.remove(); }
function openSheet(html) {
  closeSheet();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if (e.target === ov) closeSheet(); };
  ov.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  return ov;
}
function sheetError(ov, m) {
  const box = ov.querySelector(".sheet-msg");
  if (box) box.innerHTML = `<div class="msg err">${esc(m)}</div>`;
  ov.querySelector(".sheet").scrollTop = 0;
}

/* ===== Telas de entrada ===== */
function showLoading() { $app.innerHTML = `<div class="center"><div class="spinner"></div></div>`; }

async function showStart(msg) {
  showLoading();
  try {
    const setup = await getDoc(doc(db, "config", "setup"));
    if (setup.exists()) showLogin(msg); else showSetup();
  } catch (e) { showLogin(msg || errMsg(e)); }
}

function brand(sub) {
  return `<div class="brand"><div class="logo">🌾</div><h1>Delivery Farm</h1><p>${esc(sub)}</p></div>`;
}

function showLogin(msg, ok) {
  $app.innerHTML = `<div class="center"><div class="box">
    ${brand("Vendas e entregas")}
    <form class="card" id="f">
      ${msg ? `<div class="msg ${ok ? "ok" : "err"}">${esc(msg)}</div>` : ""}
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Senha</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" id="go">Entrar</button>
      <button type="button" class="link" id="forgot">Esqueci a senha</button>
    </form>
  </div></div>`;
  $("f").onsubmit = async ev => {
    ev.preventDefault();
    const b = $("go");
    setBusy(b, true, "Entrando...");
    try { await signInWithEmailAndPassword(auth, val("email"), $("pw").value); }
    catch (e) { setBusy(b, false); showLogin(errMsg(e)); }
  };
  $("forgot").onclick = async () => {
    const email = val("email");
    if (!email) return showLogin("Digite seu e-mail acima e toque em \"Esqueci a senha\" de novo.");
    try { await sendPasswordResetEmail(auth, email); showLogin("Enviamos um e-mail para você criar uma nova senha.", true); }
    catch (e) { showLogin(errMsg(e)); }
  };
}

function showSetup(msg) {
  $app.innerHTML = `<div class="center"><div class="box">
    ${brand("Primeiro acesso")}
    <form class="card" id="f">
      ${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}
      <p class="note" style="margin-top:0">Crie a conta do <b>administrador</b>. Os outros usuários você cadastra depois, dentro do app.</p>
      <label for="name">Nome completo</label>
      <input id="name" required>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Telefone (WhatsApp)</label>
      ${phoneFields("phone")}
      <label for="pw">Senha (mínimo 6 caracteres)</label>
      <input id="pw" type="password" autocomplete="new-password" required>
      <label for="pw2">Repita a senha</label>
      <input id="pw2" type="password" autocomplete="new-password" required>
      <button class="btn" id="go">Criar administrador</button>
    </form>
  </div></div>`;
  $("f").onsubmit = async ev => {
    ev.preventDefault();
    const name = val("name"), email = val("email"), phone = readPhone("phone");
    const pw = $("pw").value, pw2 = $("pw2").value;
    if (!phone) return showSetup("Digite o telefone.");
    if (pw !== pw2) return showSetup("As senhas não são iguais.");
    const b = $("go");
    setBusy(b, true, "Criando...");
    settingUp = true;
    try {
      let cred;
      try { cred = await createUserWithEmailAndPassword(auth, email, pw); }
      catch (e) {
        if (e.code === "auth/email-already-in-use") cred = await signInWithEmailAndPassword(auth, email, pw);
        else throw e;
      }
      const uid = cred.user.uid;
      const profile = { name, email, phone, role: "admin", active: true, createdAt: serverTimestamp() };
      const batch = writeBatch(db);
      batch.set(doc(db, "users", uid), profile);
      batch.set(doc(db, "config", "setup"), { done: true, admin: uid, at: serverTimestamp() });
      await batch.commit();
      settingUp = false;
      me = { uid, ...profile };
      tab = ACCESS.admin[0];
      startData();
      startPayReminder();
      showMain();
      toast("Administrador criado!");
    } catch (e) {
      settingUp = false;
      try { await signOut(auth); } catch {}
      showSetup(errMsg(e));
    }
  };
}

/* ===== Dados em tempo real ===== */
function stopData() { dataUnsubs.forEach(u => u()); dataUnsubs = []; data = { products: [], clients: [], regions: [], orders: [], settings: {}, loaded: {} }; }
function startData() {
  stopData();
  const onErr = e => toast(errMsg(e));
  const mark = k => { data.loaded[k] = true; refresh(); };
  dataUnsubs.push(onSnapshot(collection(db, "products"), s => { data.products = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName); mark("products"); }, onErr));
  dataUnsubs.push(onSnapshot(collection(db, "clients"), s => { data.clients = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName); mark("clients"); }, onErr));
  dataUnsubs.push(onSnapshot(collection(db, "regions"), s => { data.regions = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName); mark("regions"); }, onErr));
  dataUnsubs.push(onSnapshot(doc(db, "config", "settings"), s => { data.settings = s.exists() ? s.data() : {}; mark("settings"); }, onErr));
  const from = isoDate(addDays(new Date(), -45));
  dataUnsubs.push(onSnapshot(query(collection(db, "orders"), where("deliveryDate", ">=", from)), s => {
    data.orders = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.number || 0) - (a.number || 0));
    mark("orders");
  }, onErr));
}
function refresh() {

/* ----- Nova ordem / editar ordem ----- */
function orderSheet(preClientId, edit) {
  let client = null;
  if (edit) client = data.clients.find(c => c.id === edit.clientId) || { id: edit.clientId, name: edit.clientName, phone: edit.clientPhone, ...(edit.address || {}), regionId: edit.regionId };
  else if (preClientId) client = data.clients.find(c => c.id === preClientId) || null;
  const oldQty = {}, oldPrice = {};
  (edit?.items || []).forEach(i => { oldQty[i.productId] = (oldQty[i.productId] || 0) + i.qty; oldPrice[i.productId] = i.price; });
  const qty = { ...oldQty };
  const legacy = (edit?.items || []).filter(i => !data.products.find(p => p.id === i.productId))
    .map(i => ({ id: i.productId, name: i.name, price: i.price, stock: 0, legacy: true }));
  const products = [...data.products.filter(p => p.active !== false || oldQty[p.id]), ...legacy];
  const priceOf = p => oldPrice[p.id] ?? p.price ?? 0;
  const available = p => (p.stock || 0) + (oldQty[p.id] || 0);
  const regionOpts = sel => `<option value="">Sem região</option>` + data.regions.map(r => `<option value="${r.id}" ${r.id === sel ? "selected" : ""}>${esc(r.name)}</option>`).join("");

  const ov = openSheet(`
    <h3>${edit ? `Editar ordem #${edit.number}` : "Nova ordem"}</h3>
    <div class="sheet-msg"></div>
    <label>Cliente</label>
    <div id="ocw"></div>
    <div class="two">
      <div><label for="or">Região</label><select id="or">${regionOpts("")}</select></div>
      <div><label for="oday">Dia</label><select id="oday"><option value="sab">Sábado</option><option value="dom">Domingo</option></select></div>
    </div>
    <label for="odate">Data da entrega</label>
    <input id="odate" type="date">
    <label>Produtos</label>
    <div id="opl">${products.map(p => `
      <div class="prod">
        ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : `<div class="thumb">📦</div>`}
        <div class="info"><b>${esc(p.name)}</b><small>${money(priceOf(p))}${p.legacy ? " · produto apagado" : ` · ${available(p)} disponível`}</small></div>
        <div class="stepper ${qty[p.id] ? "has" : ""}" id="st-${p.id}">
          <button type="button" data-m="${p.id}">−</button>
          <input type="number" inputmode="numeric" min="0" value="${qty[p.id] || ""}" placeholder="0" data-q="${p.id}">
          <button type="button" data-p="${p.id}">+</button>
        </div>
      </div>`).join("") || `<div class="empty">Cadastre produtos na aba Produtos primeiro.</div>`}</div>
    <label for="onote">Observação (opcional)</label>
    <textarea id="onote" placeholder="Ex.: ligar antes, portão azul">${esc(edit?.notes)}</textarea>
    <div class="totalbar">
      <div class="row"><span>Total</span><b id="otot" style="font-size:22px">$0.00</b></div>
      <button class="btn" id="osave">${edit ? "Salvar alterações" : "Salvar ordem"}</button>
      <button type="button" class="link" data-close>Cancelar</button>
    </div>`);

  const setDay = day => { $("oday").value = day; $("odate").value = nextDateFor(day); };
  const applyClient = () => {
    const w = $("ocw");
    if (client) {
      w.innerHTML = `<div class="picked"><div><b>${esc(client.name)}</b><small>${esc(addressLine(client))}</small></div><button type="button" class="small-btn ghost" id="occ">Trocar</button></div>`;
      $("occ").onclick = () => { client = null; applyClient(); };
      $("or").value = client.regionId || "";
      const r = data.regions.find(r => r.id === client.regionId);
      if (r?.day) setDay(r.day);
    } else {
      w.innerHTML = `<input id="ocs" type="search" placeholder="Digite o nome do cliente"><div id="ocr"></div>
        <button type="button" class="link" id="ocn" style="text-align:left">+ Cadastrar cliente novo</button>`;
      const draw = () => {
        const q = $("ocs").value.trim().toLowerCase();
        const res = q ? data.clients.filter(c => (c.name || "").toLowerCase().includes(q) || (c.phone || "").includes(q.replace(/\D/g, "") || "#")).slice(0, 6) : [];
        $("ocr").innerHTML = res.length ? `<div class="results">${res.map(c => `<button type="button" data-pc="${c.id}"><b>${esc(c.name)}</b><small>${esc(addressLine(c))}</small></button>`).join("")}</div>` : (q ? `<p class="note">Nenhum cliente com esse nome.</p>` : "");
        $("ocr").querySelectorAll("[data-pc]").forEach(b => b.onclick = () => { client = data.clients.find(c => c.id === b.dataset.pc); applyClient(); });
      };
      $("ocs").oninput = draw;
      $("ocn").onclick = () => clientSheet(null, id => orderSheet(id));
    }
  };
  $("or").onchange = () => { const r = data.regions.find(r => r.id === $("or").value); if (r?.day) setDay(r.day); };
  $("oday").onchange = () => setDay($("oday").value);
  setDay("sab");
  applyClient();
  if (edit) {
    $("or").value = edit.regionId || "";
    $("oday").value = edit.day || "sab";
    $("odate").value = edit.deliveryDate;
  }

  const total = () => products.reduce((s, p) => s + (qty[p.id] || 0) * priceOf(p), 0);
  const setQty = (id, n) => {
    n = Math.max(0, Math.floor(Number(n) || 0));
    qty[id] = n;
    const st = $("st-" + id);
    st.querySelector("input").value = n || "";
    st.classList.toggle("has", n > 0);
    $("otot").textContent = money(total());
  };
  $("otot").textContent = money(total());
  ov.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setQty(b.dataset.m, (qty[b.dataset.m] || 0) - 1));
  ov.querySelectorAll("[data-p]").forEach(b => b.onclick = () => setQty(b.dataset.p, (qty[b.dataset.p] || 0) + 1));
  ov.querySelectorAll("[data-q]").forEach(i => i.oninput = () => setQty(i.dataset.q, i.value));

  $("osave").onclick = async () => {
    if (!client) return sheetError(ov, "Escolha o cliente.");
    const items = products.filter(p => qty[p.id] > 0).map(p => ({ productId: p.id, name: p.name, price: priceOf(p), qty: qty[p.id] }));
    if (!items.length) return sheetError(ov, "Escolha pelo menos um produto.");
    if (!$("odate").value) return sheetError(ov, "Escolha a data da entrega.");
    const short = items.filter(i => { const p = products.find(p => p.id === i.productId); return !p.legacy && i.qty > available(p); });
    if (short.length && !confirm(`Estoque insuficiente de: ${short.map(i => i.name).join(", ")}.\nSalvar mesmo assim?`)) return;
    const region = data.regions.find(r => r.id === $("or").value);
    const fields = {
      clientId: client.id, clientName: client.name, clientPhone: client.phone || "",
      address: { street: client.street || "", apt: client.apt || "", city: client.city || "", state: client.state || "", zip: client.zip || "" },
      regionId: region?.id || "", regionName: region?.name || "",
      day: $("oday").value, deliveryDate: $("odate").value,
      items, total: Math.round(items.reduce((s, i) => s + i.qty * i.price, 0) * 100) / 100,
      notes: val("onote")
    };
    const b = $("osave");
    setBusy(b, true, "Salvando...");
    try {
      if (edit) {
        await runTransaction(db, async tx => {
          const ref = doc(db, "orders", edit.id);
          const snap = await tx.get(ref);
          if (!snap.exists() || snap.data().status !== "aberta") throw new Error("Essa ordem não está mais aberta, não dá pra editar.");
          const prev = {}, now = {};
          (snap.data().items || []).forEach(i => prev[i.productId] = (prev[i.productId] || 0) + i.qty);
          items.forEach(i => now[i.productId] = (now[i.productId] || 0) + i.qty);
          const ids = [...new Set([...Object.keys(prev), ...Object.keys(now)])];
          const pSnaps = await Promise.all(ids.map(id => tx.get(doc(db, "products", id))));
          pSnaps.forEach((s, k) => {
            const diff = (now[ids[k]] || 0) - (prev[ids[k]] || 0);
            if (s.exists() && diff) tx.update(s.ref, { stock: (s.data().stock || 0) - diff });
          });
          tx.update(ref, { ...fields, editedBy: me.name, editedAt: serverTimestamp() });
        });
        orderDate = fields.deliveryDate;
        closeSheet();
        toast(`Ordem #${edit.number} atualizada.`);
      } else {
        const order = { ...fields, status: "aberta", paid: false, sellerId: me.uid, sellerName: me.name, createdAt: serverTimestamp() };
        const number = await runTransaction(db, async tx => {
          const cRef = doc(db, "config", "counter");
          const cSnap = await tx.get(cRef);
          const pSnaps = await Promise.all(items.map(i => tx.get(doc(db, "products", i.productId))));
          const n = (cSnap.exists() ? cSnap.data().orders || 0 : 0) + 1;
          pSnaps.forEach((s, k) => { if (s.exists()) tx.update(s.ref, { stock: (s.data().stock || 0) - items[k].qty }); });
          tx.set(cRef, { orders: n }, { merge: true });
          tx.set(doc(collection(db, "orders")), { ...order, number: n });
          return n;
        });
        orderDate = order.deliveryDate;
        closeSheet();
        toast(`Ordem #${number} salva!`);
      }
    } catch (e) { setBusy(b, false); sheetError(ov, errMsg(e)); }
  };
}

const PAY = { cash: "Cash", zelle: "Zelle", venmo: "Venmo", pendente: "Ainda não pagou" };
const DOW_LONG = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const fmtDateLong = s => { if (!s) return ""; const d = parseISO(s); return `${DOW_LONG[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };

// Distância em linha reta (milhas) e estimativa de tempo de carro
function miles(a, b) {
  const R = 3958.8, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const roadMiles = (a, b) => miles(a, b) * 1.3;
const driveMin = mi => Math.round(mi / 25 * 60 + 2);

// Ordem das paradas: vizinho mais próximo + melhoria 2-opt
function planRoute(origin, pts) {
  const rest = [...pts], path = [];
  let cur = origin;
  while (rest.length) {
    let bi = 0, bd = Infinity;
    rest.forEach((p, i) => { const d = miles(cur, p); if (d < bd) { bd = d; bi = i; } });
    cur = rest.splice(bi, 1)[0];
    path.push(cur);
  }
  const len = arr => arr.reduce((s, p, i) => s + miles(i ? arr[i - 1] : origin, p), 0);
  let best = path, bestLen = len(best), improved = true, guard = 0;
  while (improved && guard++ < 50) {
    improved = false;
    for (let i = 0; i < best.length - 1; i++) {
      for (let k = i + 1; k < best.length; k++) {
        const cand = [...best.slice(0, i), ...best.slice(i, k + 1).reverse(), ...best.slice(k + 1)];
        const l = len(cand);
        if (l < bestLen - 1e-9) { best = cand; bestLen = l; improved = true; }
      }
    }
  }
  return best;
}

function getPosition(maxAge = 60000) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("Esse celular não permite pegar a localização."));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(new Error(e.code === 1 ? "Permita o acesso à localização para o app (nas configurações do navegador)." : "Não consegui pegar sua localização. Tente de novo.")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: maxAge }
    );
  });
}

// Converte endereço em coordenadas (OpenStreetMap), guardando no cadastro do cliente
async function geocodeOrder(o) {
  const a = o.address || {};
  const line = addressLine(a);
  const c = data.clients.find(c => c.id === o.clientId);
  if (c?.lat && c.geoAddr === line) return { lat: c.lat, lng: c.lng };
  if (geoCache[line] !== undefined) return geoCache[line];
  const tries = [
    { street: a.street, city: a.city, state: a.state, postalcode: a.zip },
    { street: a.street, postalcode: a.zip },
    { q: line }
  ];
  let found = null;
  for (const t of tries) {
    const wait = 1100 - (Date.now() - lastGeo);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    lastGeo = Date.now();
    const params = new URLSearchParams({ format: "json", limit: "1", countrycodes: "us" });
    Object.entries(t).forEach(([k, v]) => { if (v) params.set(k, v); });
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?" + params);
      const j = await r.json();
      if (j[0]) { found = { lat: Number(j[0].lat), lng: Number(j[0].lon) }; break; }
    } catch {}
  }
  geoCache[line] = found;
  if (found && c) updateDoc(doc(db, "clients", c.id), { lat: found.lat, lng: found.lng, geoAddr: line }).catch(() => {});
  return found;
}

  const dates = [...new Set(live.map(o => o.deliveryDate))].sort();
  const t = today();
  if (!dates.includes(entDate)) entDate = dates.includes(t) ? t : (dates.find(d => d >= t) || dates[dates.length - 1] || null);
  if (!entDate) return el.innerHTML = `<div class="empty">Nenhuma entrega marcada ainda.</div>`;
  const dayOrders = live.filter(o => o.deliveryDate === entDate);
  const regions = [...new Set(dayOrders.map(o => o.regionName || "Sem região"))].sort();
  if (entRegion !== "all" && !regions.includes(entRegion)) entRegion = "all";
  const inRegion = dayOrders.filter(o => entRegion === "all" || (o.regionName || "Sem região") === entRegion);
  let pending = inRegion.filter(o => o.status === "aberta");
  const done = inRegion.filter(o => o.status === "entregue");

  const hasRoute = route && route.key === entKey();
  const legs = {};
  if (hasRoute) {
    const pos = {};
    pending.sort((a, b) => {
      const ia = route.ids.indexOf(a.id), ib = route.ids.indexOf(b.id);
      return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib);
    });
    let prev = route.origin;
    pending.forEach(o => {
      const p = route.coords[o.id];
      if (p && prev) { const mi = roadMiles(prev, p); legs[o.id] = { mi, min: driveMin(mi) }; prev = p; }
    });
  } else {
    pending.sort((a, b) => (a.address?.zip || "").localeCompare(b.address?.zip || "") || (a.clientName || "").localeCompare(b.clientName || ""));
  }
  const totalMi = Object.values(legs).reduce((s, l) => s + l.mi, 0);
  const totalMin = Object.values(legs).reduce((s, l) => s + l.min, 0) + pending.length * 5;

  el.innerHTML = `
    <div class="chips">${dates.map(d => `<button class="chip ${d === entDate ? "on" : ""}" data-ed="${d}">${fmtDate(d)}</button>`).join("")}</div>
    ${regions.length > 1 ? `<div class="chips">
      <button class="chip ${entRegion === "all" ? "on" : ""}" data-er="all">Todas as regiões</button>
      ${regions.map(r => `<button class="chip ${r === entRegion ? "on" : ""}" data-er="${esc(r)}">${esc(r)}</button>`).join("")}
    </div>` : ""}
    <div class="summary">
      <div><small>Faltam</small><b>${pending.length}</b></div>
      <div><small>Entregues</small><b>${done.length}</b></div>
      <div><small>${hasRoute ? "Rota" : "Total"}</small><b>${hasRoute ? `${totalMi.toFixed(0)} mi` : money(inRegion.reduce((s, o) => s + (o.total || 0), 0))}</b></div>
    </div>
    ${pending.length ? `
      <button class="btn" id="eroute" style="margin-top:0">📍 ${hasRoute ? "Refazer rota pela minha localização" : "Organizar rota pela minha localização"}</button>
      ${hasRoute ? `<p class="note">Rota com ${pending.length} parada${pending.length > 1 ? "s" : ""}, cerca de ${Math.floor(totalMin / 60) ? Math.floor(totalMin / 60) + "h" : ""}${totalMin % 60}min contando 5 min por entrega. Distâncias aproximadas.</p>
        <a class="btn ghost" id="egmaps" target="_blank" rel="noopener">🗺️ Rota completa no Google Maps</a>` : ""}
      <h4>Paradas</h4>
      <div class="list">${pending.map((o, i) => stopCard(o, i + 1, legs[o.id])).join("")}</div>` :
      `<div class="card soon"><div class="i">🎉</div><p><b>Todas as entregas desse dia foram feitas!</b></p></div>`}
    ${done.length ? `<h4>Entregues</h4><div class="list">${done.map(o => `
      <button class="item" data-o="${o.id}">
        <div class="thumb">✅</div>
        <div class="info"><b>#${o.number} · ${esc(o.clientName)}</b><small>${o.deliveryMode === "local" ? "Deixado no local" : "Em mãos"} · ${esc(PAY[o.paymentMethod] || "")}${o.deliveredBy ? " · " + esc(o.deliveredBy) : ""}</small></div>
        <div class="right"><b>${money(o.total)}</b><span class="badge ${o.paid ? "" : "red"}">${o.paid ? "Pago" : "Não pago"}</span></div>
      </button>`).join("")}</div>` : ""}`;

  el.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => { entDate = b.dataset.ed; drawEntregas(); });
  el.querySelectorAll("[data-er]").forEach(b => b.onclick = () => { entRegion = b.dataset.er; drawEntregas(); });
  el.querySelectorAll("[data-o]").forEach(b => b.onclick = () => orderDetail(data.orders.find(o => o.id === b.dataset.o)));
  el.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => deliverySheet(data.orders.find(o => o.id === b.dataset.bx)));
  el.querySelectorAll("[data-av]").forEach(b => b.onclick = () => notifyArrival(data.orders.find(o => o.id === b.dataset.av), b));
  el.querySelectorAll("[data-hp]").forEach(b => b.onclick = () => toggleHousePhoto(b));
  const rb = $("eroute");
  if (rb) rb.onclick = () => buildRoute(rb, pending);
  const gm = $("egmaps");
  if (gm) {
    const stops = pending.map(o => route.coords[o.id] ? `${route.coords[o.id].lat},${route.coords[o.id].lng}` : addressLine(o.address || {})).slice(0, 10);
    const dest = stops[stops.length - 1];
    const wps = stops.slice(0, -1);
    gm.href = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(dest)}${wps.length ? "&waypoints=" + encodeURIComponent(wps.join("|")) : ""}`;
  }
}

async function buildRoute(btn, pending) {
  setBusy(btn, true, "Pegando sua localização...");
  let origin;
  try { origin = await getPosition(0); }
  catch (e) { setBusy(btn, false); return toast(e.message); }
  const pts = [], missing = [];
  for (let i = 0; i < pending.length; i++) {
    btn.textContent = `Localizando endereços ${i + 1} de ${pending.length}...`;
    const g = await geocodeOrder(pending[i]);
    if (g) pts.push({ id: pending[i].id, ...g }); else missing.push(pending[i]);
  }
  const ordered = planRoute(origin, pts);
  const coords = {};
  pts.forEach(p => coords[p.id] = { lat: p.lat, lng: p.lng });
  route = { key: entKey(), ids: [...ordered.map(p => p.id), ...missing.map(o => o.id)], origin, coords, at: Date.now() };
  saveRoute();
  drawEntregas();
  if (missing.length) toast(`${missing.length} endereço${missing.length > 1 ? "s" : ""} não encontrado${missing.length > 1 ? "s" : ""} no mapa, ficou no fim da lista.`);
  else toast("Rota organizada!");
}

async function notifyArrival(o, btn) {
  if (!o) return;
  let minutes = null;
  const dest = route?.coords?.[o.id];
  if (dest) {
    setBusy(btn, true, "...");
    try { const here = await getPosition(30000); minutes = Math.max(5, Math.ceil(driveMin(roadMiles(here, dest)) / 5) * 5); } catch {}
    setBusy(btn, false);
  }
  if (minutes == null) {
    const ans = prompt("Em quantos minutos você chega?", "15");
    if (ans === null) return;
    minutes = Math.max(1, parseInt(ans, 10) || 15);
  }
  const text = `Olá, ${firstName(o.clientName)}! Aqui é o entregador do ${biz()}. Estou a caminho com o seu pedido #${o.number} e chego em aproximadamente ${minutes} minutos.`;
  window.open(waLink(o.clientPhone, text), "_blank");
  updateDoc(doc(db, "orders", o.id), { notifiedAt: serverTimestamp(), notifiedEta: minutes }).catch(() => {});
}

    ? `Acabei de deixar sua mercadoria no local combinado. A foto de onde deixei está aqui.\n`

  if (pay === "cash") t += `\nPagamento recebido em dinheiro. Muito obrigado!`;
  else {
    t += pay === "zelle" || pay === "venmo"

      : `\nPor favor, faça o pagamento por:\n${p.length ? p.join("\n") : "Zelle ou Venmo"}`;

  }
  return t;
}

/* ===== CONTAS ===== */
let payFilter = "cobrar", payDate = "all", payTimer = null;
const isDue = o => o.status === "entregue" && !o.paid;
const tsDate = t => t?.toDate ? t.toDate() : null;
function daysSince(t) {
  const d = tsDate(t);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
const canConfirm = () => can("admin", "contador");

function renderContas(main) {
  main.innerHTML = `<h2>Contas</h2><div id="ab"></div><div id="cl"></div>`;
  drawContas();
}

function drawContas() {
  const el = $("cl");
  if (!el) return;
  if (!data.loaded.orders) return el.innerHTML = loading;
  const live = data.orders.filter(o => o.status !== "cancelada");
  const dates = [...new Set(live.map(o => o.deliveryDate))].sort().reverse();
  if (payDate !== "all" && !dates.includes(payDate)) payDate = "all";
  const inDate = live.filter(o => payDate === "all" || o.deliveryDate === payDate);
  const due = inDate.filter(isDue);
  const paid = inDate.filter(o => o.paid);
  const notYet = inDate.filter(o => o.status === "aberta" && !o.paid);
  const sum = arr => arr.reduce((s, o) => s + (o.total || 0), 0);
  const byMethod = {};
  paid.forEach(o => { const m = o.paidMethod || o.paymentMethod || "outro"; byMethod[m] = (byMethod[m] || 0) + (o.total || 0); });
  const list = payFilter === "cobrar" ? due : payFilter === "pagas" ? paid : payFilter === "abertas" ? notYet : inDate;
  list.sort((a, b) => payFilter === "cobrar"
    ? (tsDate(a.deliveredAt)?.getTime() || 0) - (tsDate(b.deliveredAt)?.getTime() || 0)
    : (b.number || 0) - (a.number || 0));

  const ab = $("ab");
  if (ab) {
    const showBanner = me.role === "contador" && "Notification" in window && Notification.permission === "default";
    ab.innerHTML = showBanner ? `<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:center">
      <div style="flex:1;font-size:15px">🔔 Ative os avisos pra receber o lembrete de cobrança de hora em hora.</div>
      <button class="small-btn" id="anot">Ativar</button></div>` : "";
    const an = $("anot");
    if (an) an.onclick = async () => { try { await Notification.requestPermission(); } catch {} drawContas(); };
  }

  el.innerHTML = `
    <div class="chips">
      <button class="chip ${payDate === "all" ? "on" : ""}" data-pd="all">Todas as datas</button>
      ${dates.map(d => `<button class="chip ${d === payDate ? "on" : ""}" data-pd="${d}">${fmtDate(d)}</button>`).join("")}
    </div>
    <div class="summary">
      <div class="due"><small>A cobrar</small><b>${money(sum(due))}</b><small>${due.length} ordem${due.length === 1 ? "" : "s"}</small></div>
      <div class="ok"><small>Recebido</small><b>${money(sum(paid))}</b><small>${paid.length} ordem${paid.length === 1 ? "" : "s"}</small></div>
    </div>
    ${paid.length ? `<p class="note" style="margin:-4px 0 12px">Recebido por forma: ${Object.entries(byMethod).map(([m, v]) => `${esc(PAY[m] || m)} ${money(v)}`).join(" · ")}</p>` : ""}
    <div class="chips">
      <button class="chip ${payFilter === "cobrar" ? "on" : ""}" data-pf="cobrar">🔴 A cobrar (${due.length})</button>
      <button class="chip ${payFilter === "pagas" ? "on" : ""}" data-pf="pagas">🟢 Pagas (${paid.length})</button>
      <button class="chip ${payFilter === "abertas" ? "on" : ""}" data-pf="abertas">⏳ Não entregues (${notYet.length})</button>
      <button class="chip ${payFilter === "todas" ? "on" : ""}" data-pf="todas">Todas</button>
    </div>
    <div class="list">${list.map(payCard).join("") || `<div class="empty">${payFilter === "cobrar" ? "Nada pra cobrar. Tudo em dia! 🎉" : "Nenhuma ordem aqui."}</div>`}</div>
    <button class="btn ghost" id="prep">📄 Baixar relatório${payDate === "all" ? "" : " de " + fmtDate(payDate)}</button>`;

  el.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { payDate = b.dataset.pd; drawContas(); });
  el.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { payFilter = b.dataset.pf; drawContas(); });
  el.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => paySheet(data.orders.find(o => o.id === b.dataset.pay)));
  $("prep").onclick = () => downloadReport(inDate);
}

  const reported = o.paymentMethod && o.paymentMethod !== "pendente" ? o.paymentMethod : "";
  const ov = openSheet(`
    <div class="row" style="margin-bottom:4px"><h3>#${o.number} · ${esc(o.clientName)}</h3></div>

    ${o.deliveredBy ? `<div class="kv"><span>Entregador</span><b>${esc(o.deliveredBy)}</b></div>` : ""}
    ${o.paymentMethod ? `<div class="kv"><span>Entregador informou</span><b>${esc(PAY[o.paymentMethod] || o.paymentMethod)}</b></div>` : ""}
    <div class="kv"><span>Vendedor</span><b>${esc(o.sellerName || "—")}</b></div>
    ${o.paid ? `<div class="kv"><span>Confirmado por</span><b>${esc(o.paidConfirmedBy || "—")}${tsDate(o.paidAt) ? " · " + tsDate(o.paidAt).toLocaleDateString("pt-BR") : ""}</b></div>` : ""}
    ${!o.paid && canConfirm() ? `
      <label>Recebido por</label>
      <div class="opts">
        ${["cash", "zelle", "venmo"].map(k => `<label class="opt"><input type="radio" name="pm" value="${k}" ${reported === k ? "checked" : ""}><span>${k === "cash" ? "💵" : k === "zelle" ? "🏦" : "📱"} ${PAY[k]}</span></label>`).join("")}
      </div>
      <p class="note">Confira no banco, no Zelle ou no Venmo antes de confirmar.</p>
      <button class="btn" id="pconf">✅ Confirmar pagamento</button>` : ""}
    ${!o.paid && o.clientPhone ? `<a class="btn ghost" id="pchg" href="${waLink(o.clientPhone, chargeText(o))}" target="_blank" rel="noopener">💬 Cobrar no WhatsApp</a>` : ""}
    <button class="btn ghost" id="pdet">Ver ordem completa</button>
    ${o.paid && canConfirm() ? `<button class="btn danger" id="pundo">Desfazer confirmação</button>` : ""}
    <button type="button" class="link" data-close>Fechar</button>`);

  const cf = $("pconf");
  if (cf) cf.onclick = async () => {
    const m = ov.querySelector("input[name=pm]:checked")?.value;
    if (!m) return sheetError(ov, "Escolha como o pagamento foi recebido.");
    setBusy(cf, true, "Confirmando...");
    try {
      await updateDoc(doc(db, "orders", o.id), { paid: true, paidMethod: m, paidConfirmedBy: me.name, paidConfirmedById: me.uid, paidAt: serverTimestamp() });
      closeSheet();
      toast(`#${o.number} confirmada como paga.`);
    } catch (e) { setBusy(cf, false); sheetError(ov, errMsg(e)); }
  };
  const ch = $("pchg");
  if (ch) ch.onclick = () => { updateDoc(doc(db, "orders", o.id), { chargedAt: serverTimestamp(), chargedBy: me.name }).catch(() => {}); };
  $("pdet").onclick = () => orderDetail(o);
  const un = $("pundo");
  if (un) un.onclick = async () => {
    if (!confirm(`Voltar a ordem #${o.number} para "não paga"?`)) return;
    try {
      await updateDoc(doc(db, "orders", o.id), { paid: false, paidMethod: "", paidConfirmedBy: "", undoneBy: me.name, undoneAt: serverTimestamp() });
      closeSheet(); toast("Confirmação desfeita.");
    } catch (e) { sheetError(ov, errMsg(e)); }
  };
}

function downloadReport(orders) {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const head = ["Ordem", "Data entrega", "Cliente", "Telefone", "Região", "Vendedor", "Entregador", "Status", "Total", "Pago", "Forma de pagamento", "Confirmado por"];
  const rows = [...orders].sort((a, b) => (a.number || 0) - (b.number || 0)).map(o => [
    o.number, o.deliveryDate, o.clientName, o.clientPhone, o.regionName, o.sellerName, o.deliveredBy || "",
    STATUS[o.status]?.[0] || o.status, (o.total || 0).toFixed(2), o.paid ? "Sim" : "Não",
    PAY[o.paidMethod || o.paymentMethod] || "", o.paidConfirmedBy || ""
  ].map(q).join(","));
  const csv = "﻿" + head.map(q).join(",") + "\n" + rows.join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `contas-${payDate === "all" ? today() : payDate}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

// Contador da aba e lembrete de hora em hora (enquanto o app estiver aberto)
function updatePayBadge() {
  const dot = $("contas-dot");
  if (!dot) return;
  const n = data.orders.filter(isDue).length;
  dot.textContent = n > 99 ? "99+" : n;
  dot.style.display = n && can("admin", "contador") ? "inline-block" : "none";
}
function startPayReminder() {
  stopPayReminder();
  if (me?.role !== "contador") return;
  const check = () => {
    const due = data.orders.filter(isDue);
    if (!due.length) return;
    const total = due.reduce((s, o) => s + (o.total || 0), 0);
    const msg = `${due.length} ordem${due.length > 1 ? "s" : ""} entregue${due.length > 1 ? "s" : ""} sem pagamento confirmado (${money(total)}).`;
    try {
      if ("Notification" in window && Notification.permission === "granted") new Notification("Delivery Farm · Cobranças", { body: msg });
      else toast(msg);
    } catch { toast(msg); }
  };
  setTimeout(check, 8000);
  payTimer = setInterval(check, 60 * 60 * 1000);
}
function stopPayReminder() { if (payTimer) clearInterval(payTimer); payTimer = null; }

/* ===== Equipe (só administrador) ===== */
function renderTeam(main) {
  main.innerHTML = `<div class="row"><h2>Equipe</h2><button class="small-btn" id="add">+ Novo usuário</button></div>
    <div class="list" id="ul">${loading}</div>`;
  $("add").onclick = () => userSheet();
  if (!unsubUsers) {
    unsubUsers = onSnapshot(collection(db, "users"), snap => {
      users = snap.docs.map(d => ({ uid: d.id, ...d.data() }))
        .sort((a, b) => (a.active === false) - (b.active === false) || (a.name || "").localeCompare(b.name || ""));
      drawUsers();
    }, e => { const ul = $("ul"); if (ul) ul.innerHTML = `<div class="msg err">${esc(errMsg(e))}</div>`; });
  } else drawUsers();
}

function drawUsers() {
  const ul = $("ul");
  if (!ul) return;
  ul.innerHTML = users.map(u => `
    <button class="item" data-u="${u.uid}">
      <div class="avatar">${esc(initials(u.name))}</div>
      <div class="info"><b>${esc(u.name)}${u.uid === me.uid ? " (você)" : ""}</b>
        <small>${esc(prettyPhone(u.phone))}</small><small>${esc(u.email)}</small></div>
      <span class="badge ${u.active === false ? "off" : ""}">${u.active === false ? "Desativado" : esc(ROLES[u.role] || u.role)}</span>
    </button>`).join("") || `<p class="note">Nenhum usuário ainda.</p>`;
  ul.querySelectorAll("[data-u]").forEach(b => b.onclick = () => userSheet(users.find(u => u.uid === b.dataset.u)));
}

function userSheet(u) {
  const editing = !!u, self = editing && u.uid === me.uid;
  const ov = openSheet(`<form id="uf">
    <h3>${editing ? "Editar usuário" : "Novo usuário"}</h3>
    <div class="sheet-msg"></div>
    <label for="un">Nome completo</label>
    <input id="un" value="${esc(u?.name)}" required>
    <label for="ue">E-mail (login)</label>
    <input id="ue" type="email" value="${esc(u?.email)}" ${editing ? "disabled" : "required"}>
    <label>Telefone (WhatsApp)</label>
    ${phoneFields("up", u?.phone || "")}
    <label for="ur">Tipo de usuário</label>
    <select id="ur" ${self ? "disabled" : ""}>
      ${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${(u?.role || "vendedor") === k ? "selected" : ""}>${v}</option>`).join("")}
    </select>
    ${editing ? `
      ${self ? "" : `<div class="switch"><span>Acesso ativo</span><input type="checkbox" id="ua" ${u.active !== false ? "checked" : ""}></div>`}
      <button class="btn" id="usave">Salvar</button>
      <button type="button" class="btn ghost" id="ureset">Enviar e-mail para trocar a senha</button>
    ` : `
      <label for="upw">Senha inicial (mínimo 6 caracteres)</label>
      <input id="upw" type="text" autocomplete="off" required>
      <p class="note">Passe essa senha para a pessoa. Ela pode trocar depois em "Esqueci a senha".</p>
      <button class="btn" id="usave">Cadastrar</button>
    `}
    <button type="button" class="link" data-close>Cancelar</button>
  </form>`);

  if (editing) {
    $("ureset").onclick = async () => {
      try { await sendPasswordResetEmail(auth, u.email); toast("E-mail de troca de senha enviado."); }
      catch (e) { sheetError(ov, errMsg(e)); }
    };
  }

  $("uf").onsubmit = async ev => {
    ev.preventDefault();
    const name = val("un"), phone = readPhone("up"), role = self ? u.role : val("ur");
    if (!phone) return sheetError(ov, "Digite o telefone.");
    const b = $("usave");
    setBusy(b, true, "Salvando...");
    try {
      if (editing) {
        const upd = { name, phone, role };
        if (!self) upd.active = $("ua").checked;
        await updateDoc(doc(db, "users", u.uid), upd);
        toast("Usuário atualizado.");
      } else {
        const email = val("ue"), pw = $("upw").value;
        const cred = await createUserWithEmailAndPassword(secAuth, email, pw);
        const uid = cred.user.uid;
        await signOut(secAuth);
        await setDoc(doc(db, "users", uid), { name, email, phone, role, active: true, createdAt: serverTimestamp() });
        toast(`${ROLES[role]} cadastrado!`);
      }
      closeSheet();
    } catch (e) {
      setBusy(b, false);
      sheetError(ov, errMsg(e));
    }
  };
}

/* ===== Início ===== */
showLoading();
onAuthStateChanged(auth, async user => {
  if (settingUp) return;
  if (!user) {
    me = null;
    if (unsubUsers) { unsubUsers(); unsubUsers = null; }
    stopData();
    stopPayReminder();
    closeSheet();
    return showStart();
  }
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists() || snap.data().active === false) {
      await signOut(auth);
      return showLogin(snap.exists() ? "Seu acesso está desativado. Fale com o administrador." : "Usuário sem cadastro no app. Fale com o administrador.");
    }
    me = { uid: user.uid, ...snap.data() };
    tab = (ACCESS[me.role] || [])[0];
    startData();
    startPayReminder();
    showMain();
  } catch (e) {
    showLogin(errMsg(e));
  }
});
</script>
